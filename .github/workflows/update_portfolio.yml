name: Automated Portfolio Update

on:
  schedule:
    # 20:39 ICT = 13:39 UTC (Mon-Fri, เลี่ยงคิวหนาแน่น) หลังเปิดตลาดช่วง DST (มี.ค.-พ.ย.) แต่ก่อนเปิดตลาดช่วงฤดูหนาว (ตลาดเปิด 14:30 UTC)
    - cron: '39 13 * * 1-5'
    # 04:12 ICT (อังคาร - เสาร์ เช้าหลังปิดตลาดสหรัฐฯ) = 21:12 UTC (Mon-Fri, เลี่ยงคิวหนาแน่น)
    - cron: '12 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: 'Asia/Bangkok'

jobs:
  update-portfolio:
    name: Refresh Portfolio Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all portfolio reports
        run: |
          python3 portfolio.py --all

      - name: Commit and push updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: automated portfolio update [skip ci]"
            git push
          fi
