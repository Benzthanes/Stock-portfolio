name: Automated Portfolio Update

on:
  schedule:
    # Times are UTC (ICT - 7 hours).
    # 11:56 UTC = 18:56 ICT Mon-Fri.
    - cron: '56 11 * * 1-5'
    # 19:13 UTC Mon-Fri = 02:13 ICT Tue-Sat.
    - cron: '13 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: portfolio-update
  cancel-in-progress: false

env:
  TZ: 'Asia/Bangkok'

jobs:
  update-portfolio:
    name: Refresh Portfolio Reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Compute cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore market data caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/candles_cache.json
            data/.news_cache.json
            data/financials_cache.json
          # Keys are immutable, so the run id makes every run save a fresh copy. Restore falls back to today, then any day.
          key: portfolio-caches-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            portfolio-caches-${{ steps.date.outputs.date }}-
            portfolio-caches-

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Run all portfolio reports
        id: reports
        run: python3 -m portfolio --all

      - name: Check report data
        id: check
        if: steps.reports.outcome == 'success'
        run: python3 scripts/check_reports.py

      - name: Commit and push updated reports
        # Push whatever was generated even if a report step or the data check failed. The job still fails afterwards.
        if: success() || steps.reports.outcome == 'failure' || steps.check.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: automated portfolio update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=portfolio-update-failure
          gh label create "$label" --color B60205 --description "Automated portfolio update failed" 2>/dev/null || true
          body="Portfolio update failed on $(date -u '+%Y-%m-%d %H:%M UTC'). Run: $RUN_URL"
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Automated portfolio update failed" --label "$label" --body "$body"
          fi
